services:
  rdrive:
    build: .
    container_name: rdrive
    ports:
      - "8080:8080"
      # Uncomment to expose raw rclone api and webui. IMPORTANT: Set Rclone__Password to secure password!
      # - "5572:5572"
    volumes:
      - rclone-config:/root/.config/rclone
      - rdrive-data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Rclone__Path=rclone
      - Rclone__Address=http://127.0.0.1:5572
      - Rclone__User=admin
      - Rclone__Password=securepass
      # Single-user password authentication (simplest option; leave empty to disable)
      # - Auth__Password=changeme
      # - Auth__JwtSecret=  # optional; a key is generated and persisted if unset
      # OIDC authentication (takes precedence over Auth__Password when set)
      # - Authentication__Authority=https://keycloak.example.com/realms/rdrive
      # - Authentication__Audience=account
      # - Authentication__ClientId=rdrive
      # - Authentication__RequiredRole=rdrive-user
    restart: unless-stopped

volumes:
  rclone-config:
  rdrive-data:
